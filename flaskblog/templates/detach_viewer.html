<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=yes">
    <title>{{ title }}</title>
    <link href='http://fonts.googleapis.com/css?family=Lobster+Two' rel='stylesheet' type='text/css'>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='main.css') }}">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='study.css') }}">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='modal.css') }}">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #000;
        }

        .viewer-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }

        .pdf-wrapper {
            flex: 1 1 auto;
            min-height: 0;
            width: 100%;
            position: relative;
            background-color: #000;
        }

        .pdf-wrapper embed {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* ===== LOADING OVERLAY ===== */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #000;
            z-index: 100;
            opacity: 1;
            transition: opacity 1s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Spinning circle */
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #333;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: #aaa;
            font-size: 13px;
            font-family: Arial, sans-serif;
            margin-bottom: 10px;
        }

        /* Progress bar */
        .progress-container {
            width: 200px;
            height: 6px;
            background-color: #333;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 5px;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background-color: #3498db;
            border-radius: 3px;
            transition: width 0.2s ease;
        }

        .progress-text {
            color: #888;
            font-size: 11px;
            font-family: Arial, sans-serif;
            margin-top: 8px;
        }

        .retry-btn {
            display: none;
            margin-top: 15px;
            padding: 6px 18px;
            font-size: 13px;
            color: #fff;
            background-color: #007bff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .retry-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="viewer-container">
        <div class="pdf-wrapper" id="pdfWrapper">
            <!-- Loading overlay -->
            <div class="loading-overlay" id="loadingOverlay">
                <div class="spinner" id="loadingSpinner"></div>
                <div class="loading-text" id="loadingText">Loading PDF...</div>
                <div class="progress-container" id="progressContainer">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-text" id="progressText">0%</div>
                <button class="retry-btn" id="retryBtn" type="button">Retry Loading</button>
            </div>

            <embed 
                id="pdfEmbed"
                type="application/pdf"
                title="Weekly Trading PDF">
        </div>
    </div>

    <script>
        (function() {
            var wrapper = document.getElementById('pdfWrapper');
            var embed = document.getElementById('pdfEmbed');
            var overlay = document.getElementById('loadingOverlay');
            var spinner = document.getElementById('loadingSpinner');
            var loadingText = document.getElementById('loadingText');
            var progressContainer = document.getElementById('progressContainer');
            var progressFill = document.getElementById('progressFill');
            var progressText = document.getElementById('progressText');
            var retryBtn = document.getElementById('retryBtn');
            var baseUrl = "/static/pdf/weekly{{ weekly }}.pdf";
            
            var activeXhr = null;
            var hideTimer = null;
            var resizeTimer = null;
            var activeBlobUrl = null;
            var lastW = window.innerWidth;
            var lastH = window.innerHeight;
            
            function getViewParams() {
                var isEdge = navigator.userAgent.indexOf('Edg') > -1;
                var viewParam = isEdge ? 'FitV' : 'Fit';
                return "#view=" + viewParam + "&toolbar=0&navpanes=0&scrollbar=0";
            }

            function getPdfUrl() {
                return baseUrl + getViewParams();
            }
            
            function hideLoader() {
                if (hideTimer) {
                    clearTimeout(hideTimer);
                    hideTimer = null;
                }
                overlay.classList.add('hidden');
            }
            
            function showLoader(text) {
                if (hideTimer) {
                    clearTimeout(hideTimer);
                    hideTimer = null;
                }
                overlay.classList.remove('hidden');
                spinner.style.display = 'block';
                progressContainer.style.display = 'block';
                progressText.style.display = 'block';
                retryBtn.style.display = 'none';
                loadingText.textContent = text || 'Loading PDF...';
                progressFill.style.width = '0%';
                progressText.textContent = '0%';
            }

            function showError(message) {
                if (hideTimer) {
                    clearTimeout(hideTimer);
                    hideTimer = null;
                }
                overlay.classList.remove('hidden');
                spinner.style.display = 'none';
                progressContainer.style.display = 'none';
                progressText.style.display = 'none';
                loadingText.textContent = message || 'Failed to load PDF.';
                retryBtn.style.display = 'inline-block';
            }
            
            function updateProgress(percent) {
                progressFill.style.width = percent + '%';
                progressText.textContent = Math.round(percent) + '%';
            }
            
            function loadPdf() {
                // Abort any ongoing in-flight XHR request to prevent race conditions
                if (activeXhr) {
                    try {
                        activeXhr.abort();
                    } catch (e) {}
                    activeXhr = null;
                }
                
                showLoader('Downloading PDF...');
                
                var xhr = new XMLHttpRequest();
                activeXhr = xhr;
                
                // Pure clean URL for HTTP request (no URL fragment identifiers in XHR)
                xhr.open('GET', baseUrl, true);
                xhr.responseType = 'blob';
                
                xhr.onprogress = function(event) {
                    if (event.lengthComputable) {
                        var percent = (event.loaded / event.total) * 100;
                        updateProgress(percent);
                    } else {
                        progressText.textContent = 'Downloading...';
                    }
                };
                
                xhr.onload = function() {
                    if (xhr !== activeXhr) return; // Ignore stale request callbacks
                    activeXhr = null;
                    
                    if (xhr.status >= 200 && xhr.status < 300 && xhr.response) {
                        updateProgress(100);
                        progressText.textContent = 'Rendering...';
                        
                        try {
                            // Revoke previous blob URL if any to free memory
                            if (activeBlobUrl) {
                                URL.revokeObjectURL(activeBlobUrl);
                            }
                            // Create direct memory Blob URL with PDF viewer hash parameters
                            activeBlobUrl = URL.createObjectURL(xhr.response);
                            embed.src = activeBlobUrl + getViewParams();
                        } catch (err) {
                            // Fallback to direct static path if Blob URL fails
                            embed.src = getPdfUrl();
                        }
                        
                        // Smoothly hide the loader once rendered
                        hideTimer = setTimeout(hideLoader, 1500);
                    } else {
                        // Direct fallback to static file if server returns non-200 blob
                        embed.src = getPdfUrl();
                        hideTimer = setTimeout(hideLoader, 2500);
                    }
                };
                
                xhr.onerror = function() {
                    if (xhr !== activeXhr) return;
                    activeXhr = null;
                    
                    // Attempt direct load fallback before showing error
                    try {
                        embed.src = getPdfUrl();
                        hideTimer = setTimeout(hideLoader, 2500);
                    } catch (err) {
                        showError('Unable to load PDF. Please retry.');
                    }
                };

                xhr.onabort = function() {
                    // Cleanly handled without triggering error state
                };
                
                try {
                    xhr.send();
                } catch (e) {
                    embed.src = getPdfUrl();
                    hideTimer = setTimeout(hideLoader, 2500);
                }
            }
            
            // Retry button click event
            retryBtn.addEventListener('click', function(e) {
                e.preventDefault();
                loadPdf();
            });

            // Initial load
            loadPdf();
            
            // Handle window resize (maximize/restore) cleanly with debouncing
            window.addEventListener('resize', function() {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(function() {
                    var dw = Math.abs(window.innerWidth - lastW);
                    var dh = Math.abs(window.innerHeight - lastH);
                    
                    if (dw > 50 || dh > 50) {
                        lastW = window.innerWidth;
                        lastH = window.innerHeight;
                        loadPdf();
                    }
                }, 350);
            });
        })();
    </script>
</body>
</html>
